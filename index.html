<html lang="en" data-theme="dark">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0a0a0a;
  color: #f0f0f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(37,99,235,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(99,102,241,.06) 0%, transparent 50%);
}
.login-card {
  background: #111;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px;
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
  position: relative;
  z-index: 1;
  box-shadow: 0 8px 40px rgba(0,0,0,.4);
}
.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 28px;
}
.logo-wrap img {
  height: 36px;
  filter: brightness(0) invert(1);
}
.logo-text {
  font-size: 1.4rem;
  font-weight: 700;
  color: #f0f0f0;
}
.login-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 6px;
  text-align: center;
}
.login-sub {
  font-size: .88rem;
  color: #888;
  margin-bottom: 28px;
  text-align: center;
  line-height: 1.5;
}
.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 12px 20px;
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: .92rem;
  font-weight: 500;
  color: #f0f0f0;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
  margin-bottom: 10px;
}
.google-btn:hover {
  border-color: #2563eb;
  background: #1c1c2e;
}
.google-logo { width: 20px; height: 20px; flex-shrink: 0; }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  color: #444;
  font-size: .8rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.08);
}
.email-input {
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: .92rem;
  width: 100%;
  color: #f0f0f0;
  font-family: 'Inter', sans-serif;
  margin-bottom: 8px;
  outline: none;
  transition: border-color .2s;
}
.email-input:focus { border-color: #2563eb; }
.email-input::placeholder { color: #444; }
.btn-primary {
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: .92rem;
  font-weight: 600;
  width: 100%;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  margin-bottom: 8px;
  transition: all .2s;
}
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary {
  background: transparent;
  color: #2563eb;
  border: 1px solid #2563eb;
  border-radius: 8px;
  padding: 12px;
  font-size: .92rem;
  font-weight: 500;
  width: 100%;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  margin-bottom: 10px;
  transition: all .2s;
}
.btn-secondary:hover { background: rgba(37,99,235,.1); }
.error-msg {
  display: none;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.2);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: .82rem;
  color: #f87171;
  margin-bottom: 12px;
}
.loading {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 16px 0;
}
.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: .85rem; color: #888; }
.features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 24px;
}
.feature-item {
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 8px;
  padding: 10px;
  text-align: left;
}
.feature-icon { font-size: 1rem; margin-bottom: 4px; }
.feature-title { font-size: .76rem; font-weight: 600; }
.feature-sub { font-size: .68rem; color: #666; margin-top: 2px; }
.footer-text {
  font-size: .72rem;
  color: #444;
  margin-top: 20px;
  text-align: center;
  line-height: 1.5;
}
.footer-text a { color: #666; text-decoration: none; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <img src="logo.png" alt="StudyRise"/>
    <span class="logo-text">StudyRise</span>
  </div>

  <div class="login-title">Welcome back 👋</div>
  <div class="login-sub">Sign in to access your homework planner, grades, and study tools.</div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="google-btn" onclick="signInWithGoogle()">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <input type="email" id="emailInput" class="email-input" placeholder="Email address"/>
  <input type="password" id="passwordInput" class="email-input" placeholder="Password"/>
  <button class="btn-primary" onclick="signInWithEmail()">Sign in with Email</button>
  <button class="btn-secondary" onclick="signUpWithEmail()">Create account</button>

  <div class="loading" id="loadingWrap">
    <div class="spinner"></div>
    <div class="loading-text">Signing you in...</div>
  </div>

  <div class="features">
    <div class="feature-item">
      <div class="feature-icon">📚</div>
      <div class="feature-title">Task Planner</div>
      <div class="feature-sub">Organize your homework</div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">📝</div>
      <div class="feature-title">Grade Tracker</div>
      <div class="feature-sub">Track your averages</div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">🔥</div>
      <div class="feature-title">Streaks</div>
      <div class="feature-sub">Stay motivated</div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">⚡</div>
      <div class="feature-title">Pro Features</div>
      <div class="feature-sub">€5/month</div>
    </div>
  </div>

  <div class="footer-text">
    By signing in you agree to our <a href="terms.html">terms</a> and <a href="privacy.html">privacy policy</a>.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tnvdybovafzwryrwdfup.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5yIF13i4hDxgGKixbb8JYw_AR2PcuZG';
const _authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkSession() {
  const { data: { session } } = await _authClient.auth.getSession();
  if (session) {
    window.location.href = 'studyflow-app.html';
  }
}

async function signInWithGoogle() {
  document.getElementById('loadingWrap').style.display = 'flex';
  document.getElementById('errorMsg').style.display = 'none';
  const { error } = await _authClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: 'https://studyrise.nl/studyflow-app.html' }
  });
  if (error) {
    document.getElementById('loadingWrap').style.display = 'none';
    showError(error.message);
  }
}

async function signInWithEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!email || !password) { showError('Please fill in all fields'); return; }
  document.getElementById('loadingWrap').style.display = 'flex';
  document.getElementById('errorMsg').style.display = 'none';
  const { error } = await _authClient.auth.signInWithPassword({ email, password });
  document.getElementById('loadingWrap').style.display = 'none';
  if(error) { showError(error.message); }
}

async function signUpWithEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if(!email || !password) { showError('Please fill in all fields'); return; }
  if(password.length < 6) { showError('Password must be at least 6 characters'); return; }
  document.getElementById('loadingWrap').style.display = 'flex';
  document.getElementById('errorMsg').style.display = 'none';
  const { error } = await _authClient.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: 'https://studyrise.nl/studyflow-app.html' }
  });
  document.getElementById('loadingWrap').style.display = 'none';
  if(error) { showError(error.message); }
  else { showError('✅ Check your email to confirm your account!'); }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.style.display = 'block';
  el.textContent = msg;
}

checkSession();
</script>
</body>
</html>
